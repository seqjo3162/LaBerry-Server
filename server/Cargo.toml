[package]
name = "Messenger"
version = "0.1.0"
edition = "2021"

[lib]
name = "laberry_server"
# crate-type = ["rlib"]

[features]
default = ["host"]
host = []

[dependencies]
ipnet = "2.9"
maxminddb = "0.28.1"
hyper = "1.0"
hyper-util = { version = "0.1", features = ["full"] }
tokio = { version = "1.46", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls = "0.23"
tower = { version = "0.5.3", features = ["make"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "trace", "fs", "set-header"] }
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-service = "0.3.3"
anyhow = "1.0.102"
dotenvy = "0.15"
once_cell = "1.21"
dashmap = "6.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
async-trait = "0.1.89"
chacha20poly1305 = "0.10"
hex = "0.4"
hmac = { version = "0.12", features = ["std"] }
jsonwebtoken = "10.4.0"
rand = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "time", "chrono"] }
sea-query = { version = "0.32", features = ["backend-postgres"] }
thiserror = "2.0"
sha2 = "0.11.0"
sha1 = "0.10.6"
digest = "0.10.7"
uuid = { version = "1", features = ["v4"] }
mime = "0.3"
sysinfo = "0.39.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
image = "0.25"
zip = "8.6.0"
url = "2"
regex = "1"
urlencoding = "2"
tempfile = "3"
base64 = "0.22"
rustls-pemfile = "2.1"
jsonwebkey = { version = "0.4.0", features = ["p256", "jsonwebtoken", "generate"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
crypto_box = { version = "0.9", features = ["std"] }
aes-gcm = { version = "0.10", features = ["aes"] }
hkdf = "0.13.0"
getrandom = "0.4.2"
time = { version = "0.3", features = ["macros"] }

[dev-dependencies]
jsonwebtoken = "10.4.0"
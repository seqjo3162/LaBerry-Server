<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LaBerry — Login</title>
  <link rel="stylesheet" href="/static/css/main.css?v=55">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1 class="start-page-title" data-start-page-trigger>LaBerry</h1>

    <form class="auth-form" id="auth-form">
      <input
        class="inp"
        name="username"
        placeholder="Username"
        autocomplete="username"
        required
      />

      <input
        class="inp"
        name="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />

      <button class="btn" id="submit-btn" type="submit">
        Войти
      </button>
    </form>

    <div class="auth-switch">
      <span id="switch-text">Нет аккаунта?</span>
      <a href="#" id="to-register">Регистрация</a>
      <a href="#" id="to-login" hidden>Вход</a>
    </div>

    <div class="auth-error" id="error" hidden></div>
  </div>

  <!-- Загрузочный экран -->
  <div id="loading-overlay" class="overlay hidden">
    <div class="spinner"></div>
    <p>Подключаемся к серверу...</p>
  </div>

  <script src="/static/js/start-page-link.js?v=1"></script>
  <script src="/static/js/auth.js?v=9"></script>
</body>
</html>

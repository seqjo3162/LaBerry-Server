<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Реквизиты LaBerry</title>
    <style>
        :root {
            color-scheme: dark;
            background: #080b12;
            color: #f4f0ff;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(680px, 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.04);
            padding: 28px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 28px;
        }

        dl {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 12px 18px;
            margin: 0;
        }

        dt {
            color: rgba(244, 240, 255, 0.64);
        }

        dd {
            margin: 0;
        }
    </style>
</head>
<body>
<main>
    <h1>Реквизиты</h1>
    <dl>
        <dt>Проект</dt>
        <dd>LaBerry</dd>
        <dt>Правовой статус</dt>
        <dd>ИП / самозанятый / ООО — вписать вручную</dd>
        <dt>ИНН</dt>
        <dd>000000000000</dd>
        <dt>Контакт</dt>
        <dd>support@example.com</dd>
    </dl>
</main>
</body>
</html>
